services:
  database:
    image: postgres:17
    environment:
      POSTGRES_USER: lion
      POSTGRES_PASSWORD: lion
      POSTGRES_DB: lion
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["database:/var/lib/postgresql/data", "../database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro"]
volumes:
  database:
